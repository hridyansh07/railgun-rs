[workspace]
members = [
    "crates/poseidon-rust",
    "crates/crypto",
    "crates/types",
    "crates/utils",
    "crates/commitments",
    "crates/sync",
]
# Crates still in progress, parked locally until ready to publish. They are not
# part of this workspace build and are excluded from the published repository.
exclude = [
    "crates/railgun-merkle",
    "crates/railgun-prover",
    "crates/railgun-wallet-native",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false
version = "0.1.0"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.dependencies]
aes = "0.8"
aes-gcm = "0.10"
alloy-primitives = { version = "1.6.0", features = ["serde"] }
ark-bn254 = "0.6"
ark-ff = "0.6"
ark-groth16 = { version = "0.6", default-features = false }
ark-serialize = "0.6"
ark-std = { version = "0.6", features = ["getrandom"] }
async-trait = "0.1"
bip39 = { version = "2", features = ["rand"] }
blake-hash = { version = "0.2.0", default-features = false }
commitments = { path = "./crates/commitments" }
criterion = "0.8.2"
curve25519-dalek = "4.1.3"
ed25519-dalek = "2.2.0"
futures-timer = "3"
hex = "0.4.3"
hmac = "0.12.1"
insta = { version = "1.46.3", features = ["json"] }
itertools = "0.14.0"
num-bigint = "0.4.6"
num-traits = "0.2.19"
redb = "2"
crypto = { path = "./crates/crypto" }
poseidon-rust = { path = "./crates/poseidon-rust" }
rand = "0.9.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
types = { path = "./crates/types" }
ruint = { version = "1", features = ["serde", "num-bigint", "ark-ff-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tempfile = "3"
thiserror = "2.0.18"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
utils = { path = "./crates/utils" }
tracing = "0.1.44"
tracing-test = "0.2.5"

[patch.crates-io]
ruint = { git = "https://github.com/Robert-MacWha/ruint" }
